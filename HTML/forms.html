<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <fieldset>
        <legend>Html form dummy</legend>
        <form>
            <label for="email">Username</label>
            <input type="text" id="email">
            <br>
            <br>
            <label for="password">Password</label>
            <input type="text" id="password">
            <br>
            <br>
            <input type="Submit" value="Login">
        </form>
        <hr>
        <form action="">
            <label for="datepicker">Choose Date</label>
            <br>
            <input type="date" id="datepicker">
            <br>
            <br>
            <label for="selector1">Choose your Dish</label>
            <form>
                <label for="fruits">Choose your favorite fruits:</label><br>
                <select id="fruits" name="fruits" multiple>
                    <option value="apple">Apple</option>
                    <option value="banana">Banana</option>
                    <option value="mango">Mango</option>
                    <option value="orange">Orange</option>
                    <option value="Maggi">maggi</option>
                    <option value="Choco">choco</option>
                    <option value="Juice">juice</option>
                    <option value="water">Water</option>
                </select>
            </form>

            <br>
            <br>
            <textarea name="testarea1" id="testarea1" placeholder="enter texr here"></textarea>
        </form>
    </fieldset>
    <br>
    <form action="">
        <label for="textfield">Textfield</label>
        <input type="text" name="textfield" id="textfield">
        <br>
        <br>
        <label for="button1">Button: </label>
        <input type="submit" name="button1" id="button1" value="subscribe"> 
        <br>
        <br>
        <label for="button2">Radio Button: </label>
        <input type="radio" name="button2" id="button2">
        <br>
        <br>
        <label for="checkbox1">English</label>
        <input type="checkbox" name="checkbox1" id="checkbox1">
        <label for="checkbox2">Hindi</label>
        <input type="checkbox" name="checkbox2" id="checkbox2">
        <br>
        <br>
        <label for="file1">Upload file</label>
        <input type="file" name="file1" id="file1">
        <br>
        <br>
        <label for="image1"></label>
        <input type="image" name="image1" id="image1" src="https://www.shutterstock.com/image-vector/red-arrow-icon-on-white-600nw-2484198151.jpg" alt="click here" height="50px" width="50px">
    </form>
</body>

</html>
