<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #2b2f5b;
        }

        .grid-container {
            width: 900px;
            height: 450px;

            display: grid;

            /* Width of columns */
            grid-template-columns: 1fr 1fr 1fr 1fr;

            /* Height of rows */
            grid-template-rows: 1fr 1fr 1fr;

            gap: 10px;
        }

        .box {
            border-radius: 4px;
        }

        /* Left Tall Box */
        .box1 {
            background: #6fc04e;
            grid-row: 1 / 4;
            grid-column: 1 / 2;
        }

        /* Top Center Wide */
        .box2 {
            background: #6fc04e;
            grid-column: 2 / 4;
        }

        /* Top Right */
        .box3 {
            background: #ef2d2d;
            grid-column: 4 / 5;
        }

        /* Middle Left */
        .box4 {
            background: #f4b52d;
            grid-column: 2 / 3;
        }

        /* Middle Center */
        .box5 {
            background: #ef2d2d;
            grid-column: 3 / 4;
        }

        /* Right Tall Box */
        .box6 {
            background: #6fc04e;
            grid-column: 4 / 5;
            grid-row: 2 / 4;
        }

        /* Bottom Left */
        .box7 {
            background: #ef2d2d;
            grid-column: 2 / 3;
        }

        /* Bottom Center */
        .box8 {
            background: #f4b52d;
            grid-column: 3 / 4;
        }
    </style>
</head>

<body>
    <div class="grid-container">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
        <div class="box box5"></div>
        <div class="box box6"></div>
        <div class="box box7"></div>
        <div class="box box8"></div>
    </div>
</body>

</html>
