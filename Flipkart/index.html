<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flipkart Layout Clone</title>
  <link rel="shortcut icon"
    href="https://tse4.mm.bing.net/th/id/OIP.I70WuHuME5bj3-i-LO_NhwHaHa?rs=1&pid=ImgDetMain&o=7&rm=3"
    type="image/x-icon" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f1f3f6;
    }

    /* Header */
    header {
      width: 100%;
      height: 60px;
      background-color: #2874f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: fixed;
      top: 0;
      z-index: 100;
    }

    .logo {
      color: white;
      font-weight: bold;
      font-size: 22px;
      cursor: pointer;
    }

    .search-bar {
      flex: 1;
      margin: 0 20px;
      display: flex;
    }

    .search-bar input {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 2px 0 0 2px;
    }

    .search-bar button {
      background-color: #ffe11f;
      border: none;
      padding: 8px 12px;
      border-radius: 0 2px 2px 0;
      cursor: pointer;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
      color: white;
      font-size: 14px;
    }

    .nav-right i {
      margin-right: 5px;
    }

    /* Category strip */
    .categories {
      margin-top: 60px;
      background-color: white;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
    }

    .category-item {
      text-align: center;
      font-size: 13px;
      cursor: pointer;
    }

    .category-item i {
      display: block;
      font-size: 20px;
      margin-bottom: 5px;
      color: #2874f0;
    }

    /* Banner section */
    .banner {
      margin: 20px;
      display: flex;
      gap: 10px;
    }

    .banner div {
      flex: 1;
      height: 200px;
      background-color: #ddd;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* Advertisement section */
    #advertisement {
      width: 90%;
      margin: 30px auto;
      background-color: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    #advertisement h1 {
      margin-bottom: 20px;
    }

    .adds {
      background-color: #f9f9f9;
      height: 250px;
      width: 200px;
      border-radius: 10px;
      display: inline-block;
      margin: 10px;
      text-align: center;
      line-height: 250px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <!-- Header -->
  <header>
    <div class="logo">Flipkart</div>
    <div class="search-bar">
      <input type="text" placeholder="Search for products, brands and more">
      <button><i class="fa fa-search"></i></button>
    </div>
    <div class="nav-right">
      <div><i class="fa fa-user"></i> Login</div>
      <div><i class="fa fa-shopping-cart"></i> Cart</div>
      <div><i class="fa fa-store"></i> Become a Seller</div>
    </div>
  </header>

  <!-- Categories -->
  <section class="categories">
    <div class="category-item"><i class="fa fa-tshirt"></i> Fashion</div>
    <div class="category-item"><i class="fa fa-mobile-alt"></i> Mobiles</div>
    <div class="category-item"><i class="fa fa-laptop"></i> Electronics</div>
    <div class="category-item"><i class="fa fa-couch"></i> Furniture</div>
    <div class="category-item"><i class="fa fa-gem"></i> Jewellery</div>
    <div class="category-item"><i class="fa fa-basketball-ball"></i> Sports</div>
    <div class="category-item"><i class="fa fa-book"></i> Books</div>
  </section>

  <!-- Banner -->
  <section class="banner">
    <div>Ad Banner 1</div>
    <div>Ad Banner 2</div>
    <div>Ad Banner 3</div>
  </section>

  <!-- Advertisement -->
  <div id="advertisement">
    <h1>Home & Decorates</h1>
    <div class="adds">Item 1</div>
    <div class="adds">Item 2</div>
    <div class="adds">Item 3</div>
    <div class="adds">Item 4</div>
  </div>
</body>

</html>
