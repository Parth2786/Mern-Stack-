<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>
        Lorem ipsum dolor sit amet, consectetur adipisicing elit. Quo atque quod repudiandae maxime, optio suscipit
        voluptate fugit sapiente dignissimos.
    </p>
    <script>
        // Select the first <p> element
        let para = document.getElementsByTagName('p')[0];
        // Apply styles
        para.style.backgroundColor = "red";
        para.style.padding = "2px 10px";
        para.style.fontSize = "1.5rem";
        // Log element to console
        para.cssText = "color:red";
        console.log(para);
    </script>
</body>

</html>
