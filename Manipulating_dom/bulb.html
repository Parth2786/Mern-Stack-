<!DOCTYPE html>
<html>
<head>
  <title>Light Bulb Switch</title>
</head>
<body>
  <h2>Switch On/Off Light Bulb</h2>

  <!-- Bulb image -->
  <img id="bulb" src="https://www.w3schools.com/js/pic_bulboff.gif" style="width:100px">

  <br><br>

  <!-- Buttons -->
  <button onclick="turnOn()">Switch On</button>
  <button onclick="turnOff()">Switch Off</button>

  <script>
    function turnOn() {
      document.getElementById("bulb").src = "https://www.w3schools.com/js/pic_bulbon.gif";
    }

    function turnOff() {
      document.getElementById("bulb").src = "https://www.w3schools.com/js/pic_bulboff.gif";
    }
  </script>
</body>
</html>
